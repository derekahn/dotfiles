[metadata]
name = "git-log"
description = "A channel to select from git log entries"
requirements = ["git", "delta"]

[source]
# No --graph: keeps the hash as field 0 so extraction works on merge/branch rows
command = "git log --pretty=format:'%C(yellow)%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset' --abbrev-commit --color=always"
output = "{strip_ansi|split: :0}"
ansi = true
no_sort = true

[preview]
command = "git show -p --stat --pretty=fuller --color=always '{strip_ansi|split: :0}' | delta"
